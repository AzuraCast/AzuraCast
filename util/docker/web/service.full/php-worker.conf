[program:php-worker-fast]
command=azuracast_cli queue:process --fast --worker-name=app_worker_fast
user=azuracast
priority=600
numprocs=1
autostart=false
autorestart=true

stopasgroup=true
killasgroup=true

stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:php-worker-slow]
command=azuracast_cli queue:process --no-fast --worker-name=app_worker_slow
user=azuracast
priority=600
numprocs=1
autostart=false
autorestart=true

stopasgroup=true
killasgroup=true

stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
